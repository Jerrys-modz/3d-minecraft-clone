name: Build release jar

# Fires automatically whenever a GitHub Release is published (draft -> publish,
# or "Publish release" on a new tag). Also runnable by hand via the Actions tab
# for a one-off build/sanity-check without touching Releases.
on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build fat jar (Linux/Windows/macOS natives bundled)
        run: mvn -B package -DskipTests

      - name: Upload jar to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: target/minecraft-clone.jar

      - name: Upload build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-clone
          path: target/minecraft-clone.jar

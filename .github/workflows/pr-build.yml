name: Build PR jar

# Builds a testable jar for every pull request and on demand from a PR comment:
#   - Any push to a PR (opened / updated / reopened) builds a jar and uploads it
#     as a run artifact you can download from the Actions tab.
#   - Comment "/build" on a PR to trigger a fresh build of that PR's head.
#     (The comment must come from the PR author, so randoms can't burn CI time.)
# After this workflow is merged to main it applies to every future PR and comment.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request'
      || (github.event.issue.pull_request
          && contains(github.event.comment.body, '/build')
          && github.event.comment.user.login == github.event.issue.user.login)
    steps:
      - name: Resolve PR number
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pr=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "pr=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ steps.meta.outputs.pr }}/head

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build fat jar and run unit tests (Linux/Windows/macOS natives bundled)
        run: mvn -B package

      - name: Headless smoke test
        id: smoke
        run: |
          xvfb-run -a java -cp "target/minecraft-clone.jar" com.minecraftclone.Main \
            && echo "smoke test ok"
        env:
          MCCLONE_AUTOTEST: "1"
          MCCLONE_AUTOTEST_FRAMES: "20"
          MCCLONE_AUTOTEST_PATH: smoke.png
          MCCLONE_SAVE_DIR: ./saves/smoke

      - name: Upload smoke screenshot
        if: steps.smoke.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot-pr-${{ steps.meta.outputs.pr }}
          path: smoke.png

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-clone-pr-${{ steps.meta.outputs.pr }}
          path: target/minecraft-clone.jar

      - name: Reply with the build link
        if: github.event_name == 'issue_comment'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh api -X POST \
            "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            -f body="Jar built for PR #${{ steps.meta.outputs.pr }} — grab it from the Artifacts section on this run: $RUN_URL"
